name: ForgeVault Desktop Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-desktop:
    name: Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ForgeVault and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Run smoke test before packaging
        run: python scripts/ci_smoke.py

      - name: Build ForgeVault Desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name ForgeVaultDesktop --onefile --collect-all forgevault --add-data "frontend;frontend" backend/forgevault/desktop.py
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item dist/ForgeVaultDesktop.exe artifact/ForgeVaultDesktop.exe
          @"
          ForgeVault Desktop

          Run ForgeVaultDesktop.exe to launch the local ForgeVault desktop server and browser UI.
          Default local URL: http://127.0.0.1:8765/ui
          Default data folder: %LOCALAPPDATA%\ForgeVault
          "@ | Set-Content -Encoding UTF8 artifact/README.txt

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeVaultDesktop-windows
          path: artifact
